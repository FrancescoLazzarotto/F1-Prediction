[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1predict"
version = "2.0.0"
description = "F1 race and qualifying predictor — modular, multi-race, real-time"
requires-python = ">=3.10"
dependencies = [
    "fastf1>=3.8.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "requests>=2.31",
    "typer[all]>=0.12",
    "streamlit>=1.35",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "joblib>=1.3",
    "scipy>=1.11",
    "plotly>=5.18",
    "rich>=13.0",
    "pyarrow>=14.0",
]

[project.scripts]
f1predict = "f1predict.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
